name: 台股新聞每日抓取

on:
  schedule:
    # 每個交易日台灣時間 08:17(UTC 00:17)執行,開盤前抓一輪
    - cron: "17 0 * * 1-5"
  workflow_dispatch: {}  # 允許手動觸發,方便測試

permissions:
  contents: write  # 需要寫入權限才能把 news.db 的變動 commit 回 repo

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install requests feedparser

      - name: 執行新聞抓取
        run: python stock_news_analyzer.py

      - name: Commit news.db 變動
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.db
          git diff --cached --quiet && echo "沒有新資料,略過commit" || git commit -m "自動更新新聞資料庫 $(date -u +%Y-%m-%d)"
          git push