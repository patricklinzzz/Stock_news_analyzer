name: 每週新聞訊號回測分析

on:
  schedule:
    # 每週一台灣時間 09:00(UTC 01:00)執行,抓完當天新聞之後再跑
    - cron: "0 1 * * 1"
  workflow_dispatch: {}  # 允許手動觸發,方便測試

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install pandas yfinance scipy

      - name: 執行回測分析
        run: python backtest_analysis.py

      - name: 拆解個股層級(探索用)
        run: python backtest_by_stock.py

      - name: 產生儀表板網頁
        run: python generate_dashboard.py

      - name: Commit 回測結果與儀表板
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_results/ docs/
          git diff --cached --quiet && echo "沒有新結果,略過commit" || git commit -m "自動更新每週回測結果與儀表板 $(date -u +%Y-%m-%d)"
          git push